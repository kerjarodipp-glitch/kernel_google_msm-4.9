name: Execute SUSFS Patch

on:
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Apply SUSFS patch from root
        run: |
          cd $GITHUB_WORKSPACE
          git apply --reject --whitespace=fix kernel-4.4_4.9.patch

      - name: Commit result
        run: |
          git add .
          git commit -m "Apply SUSFS patch (kernel 4.9)" || echo "Nothing to commit"
          git push
